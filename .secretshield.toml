# SecretShield configuration for this repository.
#
# This file configures the scanner for self-scans and CI checks. It ignores
# known false positives in documentation and configuration files where the
# entropy rule flags example strings, URLs, and entry points that resemble
# credentials but are not secrets.
#
# Users scanning this repository without config (or with their own config)
# will still see these findings — that is correct behaviour. They should
# review each one and decide whether to suppress it in their own config.

[paths]
# Ignore documentation and configuration files that contain example strings,
# URLs, and entry points triggering the entropy rule.
ignored_paths = [
    "docs/",
    ".github/workflows/ci.yml",
    ".pre-commit-config.yaml",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "README.md",
    "pyproject.toml",
    ".secretshield.toml",
]

[entropy]
# Slightly higher thresholds reduce noise from example strings in docs
# without missing real credentials. The default min_length=20 catches
# most real keys; 24 skips shorter example strings.
min_length = 24
min_normalized_entropy = 0.85

[rules]
# Stripe test keys and publishable keys are expected in documentation
# and examples. They are not secrets.
disabled = ["stripe-test-key", "stripe-publishable-key"]