name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit -q

      - name: Run integration tests
        run: |
          pytest tests/integration -q

      - name: Run functional tests
        run: |
          pytest tests/functional -q

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin ruff/mypy to the same versions as .pre-commit-config.yaml.
          # Unpinned installs drift (run 37896104466 pulled ruff 0.16.10,
          # whose default rule set flags 83 diagnostics that ruff 0.5.0 does
          # not), so the lint job and pre-commit must run the same tools.
          pip install ruff==0.5.0 mypy==1.10.0

      - name: Ruff check
        run: |
          ruff check src/ tests/

      - name: Ruff format check
        run: |
          ruff format --check src/ tests/

      - name: Mypy strict
        run: |
          mypy --strict src/secret_shield

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: |
          python -m build --sdist --wheel

      - name: Verify package metadata
        run: |
          python -m pip install twine
          twine check dist/*

      - name: Verify package installs
        run: |
          pip install dist/*.whl
          secret-shield --help
          secret-shield scan --help
          secret-shield git --help
          secret-shield rules --help

      - name: Verify package is importable
        run: |
          python -c "import secret_shield; print(secret_shield.__version__)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  self-scan:
    name: Repository Self-Scan
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Scan working tree (filesystem)
        id: scan_fs
        run: |
          set +e
          secret-shield scan . --format json --output scan-results.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Scan Git history (vendor rules only, entropy filtered)
        id: scan_git
        run: |
          set +e
          secret-shield git . --format json --min-confidence high_confidence --output git-history-results.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Verify self-scan findings only in tests/
        run: |
          python -c "
          import json
          import sys

          # Check filesystem scan (uses .secretshield.toml config)
          with open('scan-results.json') as f:
              fs = json.load(f)
          fs_findings = fs.get('findings', [])
          fs_non_test = [f for f in fs_findings if not f['location']['path'].startswith('tests/')]
          if fs_non_test:
              print('FAIL: Filesystem scan found non-test findings:', file=sys.stderr)
              for f in fs_non_test:
                  print(f\"  {f['location']['path']}:{f['location']['line']} {f['rule_id']}\", file=sys.stderr)
              sys.exit(1)

          # Check Git history scan (vendor rules only, entropy filtered via --min-confidence)
          with open('git-history-results.json') as f:
              git = json.load(f)
          git_findings = git.get('findings', [])
          git_non_test = [f for f in git_findings if not f['location']['path'].startswith('tests/')]
          if git_non_test:
              print('FAIL: Git history scan found non-test findings:', file=sys.stderr)
              for f in git_non_test:
                  print(f\"  {f['location']['path']}:{f['location']['line']} {f['rule_id']}\", file=sys.stderr)
              sys.exit(1)

          print('OK: All findings are in tests/ (synthetic fixtures only)')
          "

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: |
            scan-results.json
            git-history-results.json
          retention-days: 7

  credential-guard:
    name: Credential-Shaped Text Guard (Independent)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Scan for real credential patterns in non-test files (no repo config)
        run: |
          # Independent guard: runs scanner with DEFAULT config only (no .secretshield.toml),
          # checks for vendor rule matches (HIGH_CONFIDENCE+) outside tests/.
          # Entropy findings (PROBABLE) are expected noise and allowed.
          python scripts/ci_credential_guard.py .

  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit on all files
        run: |
          pre-commit run --all-files

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test, lint, build, self-scan, credential-guard]
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write  # for trusted publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Verify artifacts exist
        run: |
          ls -la dist/
          test -f dist/*.tar.gz
          test -f dist/*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Trusted publishing — no password/token needed
          skip-existing: true
